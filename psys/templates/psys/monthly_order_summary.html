<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月別受注集計</title>
</head>
<body>
    <h1>月別受注集計</h1>

    <table border="1">
        <tr>
            <th>年月</th>
            <th>受注件数</th>
            <th>売上合計</th>
        </tr>

        {% for item in summaries %}
        <tr>
            <td>{{ item.month|date:"Y年n月" }}</td>
            <td>{{ item.order_count }}件</td>
            <td>{{ item.total_sales }}円</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">受注データがありません</td>
        </tr>
        {% endfor %}
    </table>

    <p>
        <a href="{% url 'customer_list' %}">得意先一覧に戻る</a>
    </p>
</body>
</html>
