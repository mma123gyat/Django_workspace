<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
</head>
<body>

<h1>販売支援システム</h1>
<h2>従業員ログイン</h2>

<form method="post">
    {% csrf_token %}

    <p>
        <label>従業員番号</label>
        <input
            type="text"
            name="employee_no"
            maxlength="6"
            required
        >
    </p>

    <p>
        <label>パスワード</label>
        <input
            type="password"
            name="password"
            required
        >
    </p>

    <button type="submit">ログイン</button>
</form>

{% if error_message %}
    <p style="color: red;">
        {{ error_message }}
    </p>
{% endif %}

</body>
</html>
