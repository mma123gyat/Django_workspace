
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ログイン | 販売支援システム</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: "Meiryo", sans-serif;
            background: #f3f6fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 16px;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 15px;
            background: #eff6ff;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #2563eb;
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            font-size: 25px;
            color: #1e40af;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .login-button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .error-message {
            background: #fef2f2;
            color: #dc2626;
            padding: 12px;
            border: 1px solid #fecaca;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 25px;
            }

            h1 {
                font-size: 21px;
            }
        }

        .login-icon svg {
            width: 34px;
            height: 34px;
            stroke-width: 2;
        }
    </style>
    <script src="https://unpkg.com/lucide@latest"></script>
<script>
    lucide.createIcons();
</script>
</head>

<body>

<div class="login-container">

    <div class="login-header">
        <div class="login-icon">
            <i data-lucide="user-round"></i>
        </div>

        <h1>販売支援システム</h1>

        <p class="subtitle">
            従業員ログイン
        </p>
    </div>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="employee_no">
                従業員番号
            </label>

            <input
                type="text"
                id="employee_no"
                name="employee_no"
                placeholder="従業員番号を入力"
                maxlength="6"
                autocomplete="username"
                required
                autofocus
            >
        </div>

        <div class="form-group">
            <label for="password">
                パスワード
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="パスワードを入力"
                autocomplete="current-password"
                required
            >
        </div>

        <button
            type="submit"
            class="login-button"
        >
            ログイン
        </button>

    </form>

    {% if error_message %}
        <div class="error-message" role="alert">
            {{ error_message }}
        </div>
    {% endif %}

</div>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
    lucide.createIcons();
</script>
</body>
</html>
