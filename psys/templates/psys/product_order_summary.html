<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>商品別受注集計</title>
</head>
<body>

<h1>商品別受注集計</h1>

<table border="1">
    <tr>
        <th>商品コード</th>
        <th>商品名</th>
        <th>受注件数</th>
        <th>販売数量</th>
        <th>売上合計</th>
    </tr>

    {% for item in summaries %}
    <tr>
        <td>{{ item.item_code }}</td>
        <td>{{ item.item_code__item_name }}</td>
        <td>{{ item.order_count }} 件</td>
        <td>{{ item.total_quantity }} 個</td>
        <td>{{ item.total_sales }} 円</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="5">受注明細データがありません。</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
